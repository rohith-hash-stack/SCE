# T02 "tRPC Pilot" - Task 1: `initTRPC.create()` bootstrap.
#
# Grounded in the real pinned tRPC v10.45.4 checkout (packages/server/src)
# - every symbol verified against prism.cli.build_pipeline's own symbol
# table, and every pipeline stage's real transitive reachability from the
# seed verified directly via networkx.has_path over
# builder.calls_graph (TRAVERSABLE_RELATIONS: CALLS/INSTANTIATES/EXTENDS/
# IMPLEMENTS/OVERRIDES/EMBEDS), never assumed from reading source alone.
#
#   core.initTRPC.createTRPCInner                 lines 94-187
#   transformer.getDataTransformer                lines 71-78
#   core.internals.procedureBuilder.createBuilder lines 207-282
#   core.middleware.createMiddlewareFactory       lines 166-199
#   core.router.createRouterFactory               lines 194-277
#   core.router.createCallerFactory               lines 299-342
#
# Real source: `TRPCBuilder.create()` (the real `initTRPC.create({...})`
# entry point end users call) delegates to `createTRPCInner<TParams>()`,
# which returns `initTRPCInner` - the function that actually builds the
# `{ _config, procedure, middleware, router, mergeRouters,
# createCallerFactory }` object real tRPC apps destructure. `getData
# Transformer` runs first (building `config.transformer`, needed before
# anything else in the returned object is built), then the object's own
# properties are built in source order: `procedure: createBuilder(...)`,
# `middleware: createMiddlewareFactory(...)`, `router:
# createRouterFactory(config)`, `createCallerFactory:
# createCallerFactory()`. `initTRPCInner` itself is a real function
# nested inside `createTRPCInner` (a JS/TS named function expression,
# never itself a separate top-level symbol - `FUNCTION_NODE_TYPES`
# deliberately excludes `function_expression`), so every one of these
# real calls, though made from deep inside a nested closure, correctly
# attributes to `createTRPCInner`'s own candidate manifest - confirmed
# directly, this is not a guess.
#
# Real, disclosed structural finding (boundary_symbols): the returned
# object also sets `$types: createFlatProxy((key) => {...})` and exposes
# `mergeRouters` as a bare property reference (never invoked at this
# call site - `mergeRouters` is assigned, not called, so it produces no
# real `CALLS` edge here at all, unlike every other property in the same
# object). `createFlatProxy` (`shared/createProxy/index.ts`) is a real,
# genuine call this function makes, but it is declared as
# `export const createFlatProxy = <TFaux>(...) => {...}` - an arrow
# function assigned to a `const`, a node shape `FUNCTION_NODE_TYPES`
# does not register as a definition for TypeScript at all (only
# `function_declaration`/`method_definition`/`function_signature`/
# `method_signature` are). This is a genuine, disclosed indexing gap
# (not something this task routes around or pretends isn't real) -
# `createFlatProxy` cannot appear in `pipeline_symbols` because it is
# not resolvable in the real symbol table under any qualified name, so
# it is recorded in `boundary_symbols` instead.
