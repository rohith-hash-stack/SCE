#
# Real source: createProcedureCaller returns `resolve`, which recursively
# runs the procedure's middleware chain (`callRecursive`) with the real
# resolver as the last middleware in the chain. Two real, distinct
# terminal-error paths exist in the same function: (1) a middleware
# throwing is caught and normalized via getTRPCErrorFromUnknown(cause)
# inside callRecursive's own catch block; (2) a falsy/no-result from the
# whole recursive chain throws a fresh `new TRPCError({ code:
# 'INTERNAL_SERVER_ERROR', ... })` directly, a real, structurally
# distinct pipeline stage from path 1's normalization call, not a
# duplicate of it (getTRPCErrorFromUnknown's own body itself also
# constructs a TRPCError for the non-TRPCError-instance case, so
# TRPCError is real, transitively reachable pipeline-relevant context
# either way).
#
# Real, disclosed structural finding (boundary_symbols): `callRecursive`
# itself, and the `middleware(...)` call it makes at each recursion step,
# are not part of the pipeline - `callRecursive` is a real, named nested
# arrow function (never itself a separate top-level symbol - arrow
# functions are not a `FUNCTION_NODE_TYPES` definition shape at all), and
# `middleware(...)` is a call through a runtime array element
# (`_def.middlewares[callOpts.index]`), not a statically resolvable call
# site - genuinely unresolvable, not a locator gap.
