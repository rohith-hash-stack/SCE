# Real, disclosed structural finding (the exact motivating case for
# `docs/architecture_boundaries.md` Category 10's own fix, epic/engine-
# hardening-and-consolidation): `getErrorShape` is a real object-literal
# method (`createRouterFactory` -> `createRouterInner` -> `return {
