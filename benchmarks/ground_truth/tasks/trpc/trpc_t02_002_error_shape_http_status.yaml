# FromError` would never have appeared in its own candidate manifest at
# all (that call site was verified missing from the pre-fix manifest
# directly, live against this exact repo, before authoring this task).
# The fix scopes it correctly to `core.router.createRouterInner.
# getErrorShape` - its real owning function - restoring full recall.
# This task exists specifically to validate that fix against a real,
# independently-authored ground-truth pipeline, not just the spike's own
# ad hoc check.
