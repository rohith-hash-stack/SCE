# T02 "Express Pilot" - Task 2: middleware mounting (`app.use`) and the
# lazy router-construction it triggers.
#
# Grounded in the real pinned Express 4.21.0 checkout - every symbol
# verified against prism.cli.build_pipeline's own symbol table:
#
#   lib.application.use          lines 194-249
#   lib.application.lazyrouter   lines 144-154
#   lib.application.enabled      lines 438-440
#   lib.application.set          lines 359-401
#
# Transitive reachability verified via networkx.has_path over
# builder.calls_graph from the seed to every pipeline stage.
#
# Real, disclosed exclusions (both confirmed live against the real
# graph, not assumed from reading source):
#
# - `lazyrouter`'s own real calls `this._router.use(query(this.get(
#   'query parser fn')))` and `this._router.use(middleware.init(this))`
#   resolve, on the real graph, to `lib.application.query` (the local
#   `require('./middleware/query')` binding itself - a one-line variable
#   declaration, not `lib/middleware/query.js`'s real logic, since
#   Prism's current CommonJS `require()` handling doesn't follow the
#   binding into its target module) and to a dangling, unresolved
#   `lib.application.middleware.init` node (not the real
#   `lib.middleware.init.init` symbol - a different node entirely,
#   confirmed via `builder.symbol_table.get` returning `None` for it).
#   Excluded from the pipeline as low-value/wrong-target stages, not
#   silently included as if they were the real middleware logic.
# - `lazyrouter`'s own `this.get('query parser fn')`/`this.get('env')`-
#   style calls resolve, project-wide, to `lib.response.get` (Response's
#   header getter) rather than `application.js`'s own `.get` - `app.get`
#   is defined dynamically inside a `methods.forEach(...)` loop
#   (real HTTP-verb route registration), invisible to static analysis,
#   so the only symbol named `get` anywhere in the project wins by
#   default. A real "wrong resolution" pitfall (TASK_AUTHORING.md's own
#   G41 case), not included in `pipeline_symbols`.
