# T02 "Express Pilot" - Task 7: the real third-party dependency behind
# ETag generation (Category 5, closed by `feature/commonjs-require-
# resolution`).
#
# Grounded in the real pinned Express 4.21.0 checkout, with real
# installed `node_modules` (`npm install`, 400 packages) - every symbol
# verified against the real indexed symbol table and the real
# `PrismEngine.build_external_candidate_manifest` output, not assumed:
#
#   lib.utils.createETagGenerator  lines 270-278 (in-repo seed)
#   etag.index.etag                 real external stub, resolved live
#
# Real source (lib/utils.js:21, 270-278):
#
#   var etag = require('etag');
#   ...
#   function createETagGenerator (options) {
#     return function generateETag (body, encoding) {
#       var buf = !Buffer.isBuffer(body) ? Buffer.from(body, encoding) : body
#       return etag(buf, options)
#     }
#   }
#
# This is exactly the real gap Category 5 needed `feature/commonjs-
# require-resolution` for: `etag` is a *default/namespace* CommonJS
# require (`var etag = require('etag')`), used as a bare call inside a
# *nested* returned closure (`generateETag`, itself never separately
# indexed as its own symbol - the call is structurally part of
# `createETagGenerator`'s own def_node). Before this fix,
# `ConcreteGraphBuilder._parse_js_imports` had no `require()` handling
# at all (confirmed live pre-fix: `import_map.resolve('etag')` returned
# `None`, `build_external_candidate_manifest` returned an empty
# manifest). Verified live post-fix:
#
#   engine.build_external_candidate_manifest(
#       ["lib.utils.createETagGenerator"], root_imports=["etag"]
#   )
#   -> {"etag.index.etag"}, rendering
#      "/** @throws {TypeError} */ declare function etag(entity, options);"
#
# - both the real signature and a real `@throws` annotation (Category 6)
# resolved correctly through the same fix, confirming the local
# require-site alias (`etag`) does not have to match the package's own
# internal declaration name for this to work (real `etag`'s own source
# is `module.exports = etag` with `function etag(entity, options) {}`
# declared separately - here the alias and the real name happen to
# match, unlike the `path-to-regexp`/`pathToRegexp` case
# `feature/commonjs-require-resolution`'s own tests exercise
# specifically for the mismatched case).
#
# Real, disclosed scope note: this task's own zero-LLM baseline (see
# the retrieval report) must go through `PrismEngine.retrieve_two_or_
# three_pass` with `root_imports=["etag"]`, not plain `retrieve()` -
# external-dependency resolution is a Turn 2a/2b mechanism, never
# reached by a single-pass retrieval call, exactly as found and
# disclosed while investigating Queries 2/3 of the earlier LLM
# validation spike.
