# T02 "Express Pilot" - Task 6: `res.json()`'s own real serialize-then-
# write pipeline.
#
# Grounded in the real pinned Express 4.21.0 checkout - every symbol
# verified against prism.cli.build_pipeline's own symbol table:
#
#   lib.response.json       lines 250-279
#   lib.response.stringify  lines 1155-1179
#   lib.response.send       lines 111-236
#
# Transitive reachability verified via networkx.has_path over
# builder.calls_graph from the seed to every pipeline stage. Real
# source confirms json() calls stringify(val, replacer, spaces, escape)
# to serialize the body, then this.send(body) to actually write the
# response - and send() itself, for a non-string/Buffer chunk, calls
# back into this.json(chunk) (a real, mutually-referencing pair,
# matching Express's real documented behavior that res.send() delegates
# object payloads to res.json()).
#
# Real, disclosed exclusion (a second, distinct instance of the same
# kind of bare-name-collision pitfall found while authoring Tasks 1/2 -
# TASK_AUTHORING.md's G41): both json() and send() call `this.set(...)`
# for real (Content-Type/Content-Length/ETag headers) - but
# `lib.response.set` does not exist as its own indexed symbol. Reading
# the real source (response.js:776-777) shows why: `res.set = res.header
# = function header(...) {}` is a *chained* assignment, and Prism's
# property-assigned-function detector only registers the function under
# its last-assigned name (`header`), not every name in the chain
# (`set`). `this.set(...)`'s bare-name call therefore falls through to
# the only other symbol named `set` anywhere in the project -
# `lib.application.set`, a real but entirely unrelated function - shown
# as a real edge in `builder.graph` but not included here, since it is
# not what actually runs. `lib.response.header` (the real target) is
# not itself called under the name `set` anywhere Prism's static
# analysis can see, so it is not included either - a genuine detection
# gap, disclosed rather than routed around.
