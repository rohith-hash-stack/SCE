# T02 "Express Pilot" - Task 19: `range-parser` (Category 5, HTTP Range
# request parsing) - also the fourth confirmed instance of the G41
# bare-name-collision pitfall in this pilot (Tasks 6/9/10 already found
# three others).
#
# Grounded in the real pinned Express 4.21.0 checkout, with real
# installed `node_modules` - every symbol verified against the real
# indexed symbol table and the real `PrismEngine.build_external_
# candidate_manifest` output, not assumed:
#
#   lib.request.range                  lines 212-216 (in-repo seed)
#   range-parser.index.rangeParser     real external stub, resolved live
#
# Real source (lib/request.js:22,212-216):
#
#   var parseRange = require('range-parser');
#   ...
#   req.range = function range(size, options) {
#     var range = this.get('Range');
#     if (!range) return;
#     return parseRange(size, range, options);
#   };
#
# Verified live: `engine.build_external_candidate_manifest(
# ["lib.request.range"], root_imports=["range-parser"]) ->
# {"range-parser.index.rangeParser"}`, rendering
# "/** @throws {TypeError} */ declare function rangeParser(size, str,
# options);" - a third distinct real local-alias mismatch (`parseRange`
# locally, `rangeParser` internally - `node_modules/range-parser/
# index.js`: `module.exports = rangeParser; function rangeParser(size,
# str, options) {...}`), plus a real `@throws` annotation (Category 6).
#
# Real, disclosed G41 finding (a fourth confirmed instance, after Tasks
# 6/9/10's `res.set`/`lib.application.set` collisions - this one is on
# the *request* side): `req.range`'s own real first line,
# `this.get('Range')`, should call `req.get` - but, exactly like
# `res.set`/`res.header` in response.js, `req.get = req.header =
# function header(name){...}` at request.js is a *chained* assignment,
# so Prism's property-assigned-function detector only registers the
# function under its last-assigned name (`header`); `lib.request.get`
# does not exist as its own indexed symbol at all. The bare
# `this.get('Range')` call therefore resolves in `builder.graph` to
# `lib.response.get`, a real but entirely unrelated function on a
# *different* prototype object - not included in this task's pipeline,
# since it is not what actually runs.
