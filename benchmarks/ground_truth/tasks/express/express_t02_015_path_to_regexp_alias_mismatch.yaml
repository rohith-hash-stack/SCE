# T02 "Express Pilot" - Task 15: `path-to-regexp` (Category 5, the
# flagship local-alias-mismatch case `feature/commonjs-require-
# resolution` was built specifically to handle).
#
# Grounded in the real pinned Express 4.21.0 checkout, with real
# installed `node_modules` - every symbol verified against the real
# indexed symbol table and the real `PrismEngine.build_external_
# candidate_manifest` output, not assumed:
#
#   lib.router.layer.Layer  lines 33-49 (in-repo seed)
#   path-to-regexp.index.pathToRegexp  real external stub, resolved live
#
# Real source (lib/router/layer.js:16,33-49):
#
#   var pathRegexp = require('path-to-regexp');
#   ...
#   function Layer(path, options, fn) {
#     ...
#     this.regexp = pathRegexp(path, this.keys = [], opts);
#     ...
#   }
#
# This is exactly the real, motivating case for the alias-redirect
# mechanism in `prism.external.index._commonjs_primary_export_name`:
# the local require-site alias is `pathRegexp`, but the real installed
# `path-to-regexp` package declares its own default-exported function
# as `pathToRegexp` internally (`node_modules/path-to-regexp/index.js`:
# `module.exports = pathToRegexp; function pathToRegexp(path, keys,
# options) {...}`) - a real, confirmed case where the local alias does
# *not* match the target's own real internal name. Verified live:
#
#   engine.build_external_candidate_manifest(
#       ["lib.router.layer.Layer"], root_imports=["path-to-regexp"]
#   )
#   -> {"path-to-regexp.index.pathToRegexp"}
#
# Before `feature/commonjs-require-resolution`, this call site was
# entirely unresolvable (a bare default/namespace require used as a
# bare 1-segment call has no real symbol name derivable from the call
# site's own local alias - the whole reason the `_commonjs_primary_
# export_name` redirect exists).
