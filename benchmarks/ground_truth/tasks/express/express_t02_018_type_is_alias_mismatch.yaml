#
# Real source (lib/request.js:19,278-291):
#
#   var typeis = require('type-is');
#   ...
#   req.is = function is(types) {
#     var arr = types;
#     ...
#     return typeis(this, arr);
#   };
#
# Real installed `node_modules/type-is/index.js`:
#
#   module.exports = typeofrequest
#   module.exports.is = typeis
#   ...
#   function typeofrequest (req, types_) { ... }
#
# A distinct variant of the alias-mismatch pattern from Task 15's
# `path-to-regexp`/`pathToRegexp`: here the local binding `typeis` is
# not merely a *stylistic* rename of the real function's own name - it
# is bound to the package's real *default* export (`typeofrequest`),
# and only *coincidentally* happens to share a name with a completely
# different named property the same package separately exposes
# (`module.exports.is = typeis`, a real, distinct internal function).
# Verified live:
#
#   engine.build_external_candidate_manifest(
