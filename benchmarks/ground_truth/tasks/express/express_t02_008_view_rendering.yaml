# T02 "Express Pilot" - Task 8: view resolution & rendering.
#
# Grounded in the real pinned Express 4.21.0 checkout - every symbol
# verified against prism.cli.build_pipeline's own symbol table:
#
#   lib.application.render      lines 548-610
#   lib.application.tryRender   lines 655-661 (private helper)
#   lib.view.render             lines 133-136 (View.prototype.render)
#
# Transitive reachability verified via networkx.has_path over
# builder.calls_graph from the seed to every pipeline stage.
#
# Real source: app.render(name, options, callback) merges app.locals
# and the caller's own options into renderOptions, then (on a cache
# miss) looks up a View constructor and instantiates one, and finally
# calls the private helper tryRender(view, renderOptions, done), which
# itself calls view.render(options, callback) inside a try/catch.
#
# Real, disclosed structural finding: `lib.view.View` (the real View
# constructor, lib/view.js:52-91, whose own body is a rich, internally-
# reachable pipeline - View -> lookup -> resolve, all verified real and
# connected) is genuinely NOT reachable from this seed. Reading the
# real source shows why: `app.render` does not call `new View(...)`
# against a statically-known import - it does `var View = this.get(
# 'view'); view = new View(name, {...})`, a *locally rebound* name
# whose value comes from a dynamic app-settings lookup, not from any
# import/require Prism's static resolver can follow. The instantiation
# is real (and runs every time a view isn't cached) but the edge simply
# isn't there in `builder.graph` - the same class of gap `feature/
# commonjs-require-resolution`'s docstring calls out for a local
# require-site alias, generalized here to a *settings-based* rebinding
# instead of an import-based one. Recorded as `boundary_symbols` rather
# than silently omitted.
