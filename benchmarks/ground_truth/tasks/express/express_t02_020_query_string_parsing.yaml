# parsing middleware factory).
#
# Grounded in the real pinned Express 4.21.0 checkout, with real
# installed `node_modules` - every symbol verified against the real
# indexed symbol table and the real `PrismEngine.build_external_
# candidate_manifest` output, not assumed:
#
#   lib.middleware.query.query   lines 25-45 (in-repo seed)
#   parseurl.index.parseurl      real external stub, resolved live
#
# Real source (lib/middleware/query.js:15-45):
#
#   var merge = require('utils-merge')
#   var parseUrl = require('parseurl');
#   var qs = require('qs');
#
#   module.exports = function query(options) {
#     var opts = merge({}, options)
#     var queryparse = qs.parse;
#     ...
#     return function query(req, res, next){
#       if (!req.query) {
#         var val = parseUrl(req).query;
#         req.query = queryparse(val, opts);
#       }
#       next();
#     };
#   };
#
# Verified live: `engine.build_external_candidate_manifest(
# ["lib.middleware.query.query"], root_imports=["parseurl"]) ->
# {"parseurl.index.parseurl"}`, rendering "declare function
# parseurl(req);" - a real default/namespace require, called bare
# inside the returned closure (the same nested-closure shape as Task
# 7's `etag`/`generateETag`), where the local alias (`parseUrl`) matches
# the package's own real internal name.
#
# Real, disclosed non-resolution (a second, distinct instance of the
# `qs` object-literal-export gap first found while investigating
# `lib.utils.parseExtendedQueryString` during this task's own
# authoring): the returned closure's actual query-string parsing call,
# `queryparse(val, opts)`, is *two* static hops away from any real
# import binding - `queryparse` is a local variable reassigned from
# `qs.parse` inside the *outer* factory function, not a name `import_
# map` itself ever tracks (which only records names bound directly at
# a `require()`/`import` site). Even setting that aside, `qs`'s own
# real `node_modules/qs/lib/index.js` is a bare object-literal export
# (`module.exports = { parse: require('./parse'), ... }`) whose `parse`
# property is itself a separate file's own `module.exports` - not a
# locally-declared named function `prism.external.index`'s definition-
# finder can locate at all (the same disclosed non-goal already
# documented for `_commonjs_primary_export_name`: `module.exports =
# {...}` object-literal exports are out of scope). `qs` is therefore
# not included in this task's `root_imports` at all - a real, confirmed
# gap, not a task-authoring oversight.
