# T02 "Express Pilot" - Task 10: redirection (`res.redirect` ->
# `res.location`).
#
# Grounded in the real pinned Express 4.21.0 checkout - every symbol
# verified against prism.cli.build_pipeline's own symbol table:
#
#   lib.response.redirect  lines 946-990
#   lib.response.location  lines 914-926
#   lib.response.get       lines 811-813
#   lib.response.format    lines 684-709
#
# Transitive reachability verified via networkx.has_path over
# builder.calls_graph from the seed to every pipeline stage.
#
# Real source: res.redirect(url) first resolves the real target address
# via `this.location(address).get('Location')` - i.e. it delegates the
# actual Location-header construction to res.location(), then reads the
# header straight back off itself via res.get() - and then calls
# this.format({...}) to build a text/html fallback body appropriate to
# what the client accepts, before finally writing the response. This is
# a genuine, disclosed example of `TASK_AUTHORING.md`'s guidance that
# pipeline order reflects real execution order at the seed's own call
# site, not a call-chain requirement between neighbors: `location()` and
# `get()` both happen (in that order) before `format()` is ever called,
# even though `get()` is technically invoked as a continuation of
# `location()`'s own return value rather than a separate statement.
#
# Real, disclosed exclusion (the third confirmed instance of the same
# bare-name-collision pitfall found while authoring Tasks 1/2/6/9 -
# TASK_AUTHORING.md's G41): both redirect() and location() call
# `this.set(...)` for real (setting the Content-Length and Location
# headers respectively) - but `lib.response.set` does not exist as its
# own indexed symbol, for the same reason as Tasks 6/9 (a chained
# `res.set = res.header = function header(...) {}` assignment). The
# bare `this.set(...)` calls resolve in `builder.graph` to
# `lib.application.set`, a real but entirely unrelated function - not
# included here.
