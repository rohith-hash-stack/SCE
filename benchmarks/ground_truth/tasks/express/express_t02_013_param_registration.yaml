# T02 "Express Pilot" - Task 13: param callback registration
# (`app.param`).
#
# Grounded in the real pinned Express 4.21.0 checkout - every symbol
# verified against prism.cli.build_pipeline's own symbol table:
#
#   lib.application.param       lines 328-342
#   lib.application.lazyrouter  lines 144-162
#
# Transitive reachability verified via networkx.has_path over
# builder.calls_graph from the seed to every pipeline stage.
#
# Real source: app.param(name, fn) first calls this.lazyrouter() to
# ensure the app's own internal router exists (creating it on first
# use), then - for the array-of-names overload - recurses back into
# this.param(name[i], fn) for each name, and otherwise delegates the
# actual registration to this._router.param(name, fn).
#
# Real, disclosed structural finding (a new variant of G41 - not a
# receiver-type mismatch this time, but a genuine *same-file,
# same-simple-name* collision inside lib/router/index.js itself):
# `this._router.param(name, fn)`'s real target is the exported
# `proto.param = function param(name, fn) {...}` at router/index.js:97
# - the actual public router-level param registration API, whose own
# body loops over previously-registered param functions
# (`params[i](name, fn)`, a dynamic array-element call, itself not
# statically resolvable). But `builder.symbol_table.get(
# "lib.router.param")` does **not** point there - it points instead to
# an entirely different, *locally-scoped* `function param(err) {...}`
# at router/index.js:359-396, a private per-request dispatch closure
# nested inside `proto.process_params` (already the seed of
# `express_t02_003_routing_dispatch_loop.yaml`'s own pipeline). Both
# functions share the bare simple name `param` in the same module, and
# Prism's indexer keeps only one qualified name per (module, simple
# name) pair - the later-declared, private one wins here. This means
# the *real* `this._router.param(name, fn)` call site, though a real
# and reachable graph edge, resolves to a completely unrelated function
# with the same name, not the actual router-level registration API -
# exactly the class of pitfall `TASK_AUTHORING.md`'s G41 warns about
# ("a same-named symbol is reachable" is not the same as "the real call
# site actually resolves there"), just triggered by an in-module name
# collision rather than a receiver-type mismatch. It is excluded from
# this task's pipeline for that reason, leaving a genuinely thin (but
# real) two-stage chain - the real router-level param registration
# logic itself is simply not indexable under its own real name given
# this collision, a genuine limitation disclosed rather than routed
# around.
