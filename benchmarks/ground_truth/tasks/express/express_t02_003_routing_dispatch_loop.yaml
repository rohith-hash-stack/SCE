#
# Real, disclosed structural finding: `lib.router.handle` (the router's
# own public `handle(req, res, callback)` entry point) is *not* itself
# a rich pipeline seed - its own real out-edges are just `debug`,
# `getProtohost`, `restore`, `wrap`, `sendOptionsResponse`, and `next`.
# All of the actual route-matching/dispatch logic (the loop over
# `this.stack`, `getPathname`, `matchLayer`, `process_params`,
# `trim_prefix`) lives inside `next` - the router's own internal,
# closure-scoped dispatch-loop function - not inside `handle` itself.
# This task seeds directly on `next` for that reason, since it is the
# real locus of the "routing & layer dispatch" logic, verified by
# reading the real source (lines 177-291) and cross-checked against the
# real graph, not assumed.
