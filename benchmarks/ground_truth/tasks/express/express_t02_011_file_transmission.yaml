# T02 "Express Pilot" - Task 11: file transmission (`res.download` ->
# `res.sendFile`).
#
# Grounded in the real pinned Express 4.21.0 checkout - every symbol
# verified against prism.cli.build_pipeline's own symbol table:
#
#   lib.response.download  lines 550-599
#   lib.response.sendFile  lines 419-458
#   lib.response.sendfile  lines 1053-1090 (private helper, note the
#                           lowercase name - a distinct symbol from the
#                           public, capitalized `sendFile`)
#
# Transitive reachability verified via networkx.has_path over
# builder.calls_graph from the seed to every pipeline stage.
#
# Real source: res.download(path, filename, options, callback) is a
# thin real wrapper - it normalizes its own overloaded arguments, sets
# a real Content-Disposition header value, resolves the full path, and
# then simply calls `this.sendFile(fullPath, opts, done)`. sendFile()
# itself does its own real argument/type validation, then creates a
# file stream via the real third-party `send` npm package
# (`file = send(req, pathname, opts)`) and hands it to the private
# lowercase `sendfile(res, file, opts, callback)` helper, which pipes
# the stream to the response and handles the real error cases
# (EISDIR, aborted connections, write errors).
#
# This task is deliberately kept internal-only (no `root_imports`) -
# the real external delegation to the `send` npm package from this
# exact seed is covered separately, and independently verified, by
# `express_t02_016_send_file_streaming.yaml` (Category 5). Keeping them
# separate lets the benchmark grid measure in-repo reachability and
# external-symbol resolution from the *same* real call site without
# conflating the two signals in one task.
