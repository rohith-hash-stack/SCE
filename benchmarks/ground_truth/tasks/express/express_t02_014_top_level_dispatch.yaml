# T02 "Express Pilot" - Task 14: the top-level request-handling entry
# point (`app.handle`).
#
# Grounded in the real pinned Express 4.21.0 checkout, with real
# installed `node_modules` - every symbol verified against the real
# indexed symbol table and the real `PrismEngine.build_external_
# candidate_manifest` output, not assumed:
#
#   lib.application.handle  lines 165-182 (in-repo seed)
#   finalhandler.index.finalhandler  real external stub, resolved live
#
# Real source (lib/application.js:16,165-182):
#
#   var finalhandler = require('finalhandler');
#   ...
#   app.handle = function handle(req, res, callback) {
#     var router = this._router;
#     var done = callback || finalhandler(req, res, {
#       env: this.get('env'),
#       onerror: logerror.bind(this)
#     });
#     if (!router) {
#       debug('no routes defined on app');
#       done();
#       return;
#     }
#     router.handle(req, res, done);
#   };
#
# Verified live: `engine.build_external_candidate_manifest(
# ["lib.application.handle"], root_imports=["finalhandler"]) ->
# {"finalhandler.index.finalhandler"}`, rendering
# "declare function finalhandler(req, res, options);" - a real
# default/namespace require used as a bare call, exactly the same shape
# as Task 7's `etag` and Task 14's own sibling tasks.
#
# Real, disclosed structural finding: `router.handle(req, res, done)` -
# the real, final step of every request that reaches an app with routes
# defined - is **not** reachable from this seed in the static call
# graph, even though `lib.router.handle` is itself a real, indexed
# symbol (already the subject of `express_t02_003_routing_dispatch_
# loop.yaml`'s own header-comment finding about its own thin edge set).
# Reading the source shows why: `router` here is `this._router`, a
# dynamic instance property assigned elsewhere (`app.lazyrouter()`), not
# a statically-known import or local variable Prism's call resolver can
# type - the same class of gap already found for `new View(...)` in
# `express_t02_008_view_rendering.yaml` (`var View = this.get('view')`),
# now confirmed for a *third* distinct dynamically-rebound receiver in
# this same codebase. Recorded as `boundary_symbols` rather than
# silently omitted.
