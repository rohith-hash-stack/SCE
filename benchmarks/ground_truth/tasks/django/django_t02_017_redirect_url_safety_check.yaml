prompt: |
  You are debugging why a redirect URL is rejected as unsafe in
  django/utils/http.py. Starting from
  `url_has_allowed_host_and_scheme`, trace the real causal pipeline
  that validates the URL, in the order each stage is actually reached,
  up to and including the call that parses the URL into its components.
  Assume the URL does not begin with three slashes (`///`) - the one
  guard clause before parsing is reached.

  First give a short (2-4 sentence) explanation of the pipeline.

  Then, on its own line, emit a fenced JSON code block containing an
  ordered array of the fully-qualified symbol names in that causal
  order - only symbols actually present in the provided context package
  may appear, e.g.:

  ```json
  ["django.utils.http.url_has_allowed_host_and_scheme", "django.utils.http._url_has_allowed_host_and_scheme"]
  ```

