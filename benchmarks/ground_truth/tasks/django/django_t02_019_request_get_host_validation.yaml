prompt: |
  You are debugging how Django resolves and validates the HTTP Host
  header in django/http/request.py. Starting from
  `HttpRequest.get_host`, trace the real causal pipeline that
  validates the host, in the order each stage is actually reached, up
  to and including the call that checks the parsed domain against
  ALLOWED_HOSTS. Assume the parsed host has a non-empty domain
  component, so the validation call is genuinely reached.

  First give a short (2-4 sentence) explanation of the pipeline.

  Then, on its own line, emit a fenced JSON code block containing an
  ordered array of the fully-qualified symbol names in that causal
  order - only symbols actually present in the provided context package
  may appear, e.g.:

  ```json
  ["django.http.request.HttpRequest.get_host", "django.http.request.HttpRequest._get_raw_host"]
  ```

