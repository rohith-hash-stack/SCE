#
#   django.core.cache.backends.locmem.LocMemCache.get             lines 34-42  (django/core/cache/backends/locmem.py)
#   django.core.cache.backends.base.BaseCache.make_and_validate_key lines 119-123 (django/core/cache/backends/base.py)
#   django.core.cache.backends.locmem.LocMemCache._has_expired     lines 87-89  (django/core/cache/backends/locmem.py)
#   django.core.cache.backends.locmem.LocMemCache._delete          lines 101-107 (django/core/cache/backends/locmem.py)
#
# Real causal chain, read directly from source (locmem.py lines 34-42):
# get(key, default, version) first calls self.make_and_validate_key(key,
# version) to compute the real internal cache key, then - unconditionally,
# not behind a feature flag - calls self._has_expired(key); if that
# returns True, it calls self._delete(key) and returns default without
# ever reading self._cache. Only if the key has *not* expired does
# execution fall through to the pickle.loads(self._cache[key]) read.
# make_and_validate_key() itself (base.py lines 119-123) is a thin
# 2-line wrapper calling self.make_key(key, version) then
# self.validate_key(key) - real, verified callees, listed here as
# boundary (one hop past what the pipeline needs to trace).
#
# Seed check (Milestone 2 requirements): LocMemCache is a plain
# BaseCache subclass, not metaclass-generated; nothing here is async;
# no container-subscript data-flow pattern is involved (self._cache[key]
# is a read, not a write the way G7's d['k']=f() pattern is, and it is
# not part of the traced pipeline itself, only mentioned above for
# narrative completeness).
#
# required_context/boundary_symbols, also real and verified:
#   django.core.cache.backends.locmem.LocMemCache        (class) lines 16-117
#   django.core.cache.backends.base.BaseCache             (class) lines 56-388
#   django.core.cache.backends.base.BaseCache.make_key     (method) lines 97-108
#   django.core.cache.backends.base.BaseCache.validate_key (method) lines 110-117
#
# cohen_kappa is intentionally omitted - benchmarks.ground_truth.loader
# computes it for real. This task's two annotators disagree by design
# (not a mistake left uncorrected): annotator_b did not trace past
# make_and_validate_key at all, treating the expiry-check/eviction
# branch as an implementation detail rather than part of the causal
# pipeline - a real, defensible reading, but one the adjudicator
# rejects below, since _has_expired() is unconditionally reached code
# (not behind any flag), making it and _delete() genuine pipeline
# stages for a "why didn't my cache hit land" debugging narrative. This
# lands the task in the [0.60, 0.80) adjudicate tier on purpose, to
# exercise that gate for real rather than only ever landing auto-pass
# cases.
