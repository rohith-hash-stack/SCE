# set_script_prefix() runs on its result; both unconditional, the very
# first thing this method does. The next two source statements are
# `signals.request_started.send(...)` and
# `request = self.request_class(environ)` - both real and reached, but
# deliberately excluded from this pipeline: request_started is a
# module-level Signal *instance*, and calling `.send()` on it does not
# resolve to a real qualified symbol in this codebase's index (the
# instance-attribute call site, not a class method); `self.request_
# class(environ)` resolves in builder.graph to the `request_class`
# class-attribute descriptor, not to `WSGIRequest` itself - neither is
# a trustworthy pipeline member to assert as ground truth, so this task
# skips straight to the next real, cleanly-resolved call:
# `response = self.get_response(request)`. Every stage in the final
# 4-symbol chain is unconditional - no branch in __call__ runs before
# line 124.
#
# Seed check (Milestone 2 requirements): WSGIHandler is a plain
# BaseHandler subclass, not metaclass-generated; nothing here is
# async/await (this is the *synchronous* WSGI entrypoint specifically -
# ASGIHandler.__call__ is the separate async counterpart, not this
# seed); no container-subscript data-flow pattern is involved (pure
# call-chain).
#
# required_context/boundary_symbols, also real and verified:
#   django.core.handlers.wsgi.WSGIHandler                 (class)  lines 113-144
#   django.core.handlers.base.BaseHandler.load_middleware   (method) lines 26-102
#
# django_t02_001_request_middleware_chain already traces what happens
