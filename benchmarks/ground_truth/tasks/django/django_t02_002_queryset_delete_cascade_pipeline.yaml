# T02 "Django Debug" - Task 2: QuerySet bulk-delete cascade pipeline.
#
# Reseeded (v2) and RENAMED after the corrected transitive-reachability
# audit found the original seed (QuerySet._fetch_all) genuinely
# unreachable to Query.get_compiler - no path of any length connects
# them via CALLS/INSTANTIATES/EXTENDS/IMPLEMENTS/OVERRIDES/EMBEDS in
# builder.graph. The old filename ("query_compile_pipeline") described
# SQL compilation; this replacement is a different ORM subsystem
# (cascade delete), so the old name would mislabel it - renamed rather
# than kept for accuracy. Same repo/task-type, both real ORM subsystems.
#
# New seed: QuerySet.delete, whose real out-edges (verified directly
# against builder.graph, not inferred from source alone) are:
#   QuerySet.delete -> Collector.collect          [CALLS]
#   QuerySet.delete -> Collector.delete           [CALLS]
#   QuerySet.delete -> Collector (the class)      [INSTANTIATES]
#   Collector.collect -> Collector.get_del_batches [CALLS] (inside a loop, deletion.py:~318)
#   Collector.delete -> Collector.get_del_batches  NO EDGE - get_del_batches
#     is only ever called from collect(), never from delete() - confirmed
#     directly against builder.graph before writing this pipeline, per
#     the user's own verification request (2026-09-14). The linear order
#     below (delete -> collect -> get_del_batches -> delete) is correct.
#
# Grounded in the real pinned Django 4.2.30 checkout (pinned_commit
# below, matching benchmarks/corpora/pinned_commits.json's own "django"
# entry, tag 4.2.30) - every symbol here is real and indexed, verified
# against the real symbol table produced by prism.cli.build_pipeline on
# that checkout (qualified names and line ranges below match exactly).
#
#   django.db.models.query.QuerySet.delete              lines 1126-1154
#   django.db.models.deletion.Collector.collect          lines 247-401
#   django.db.models.deletion.Collector.get_del_batches  lines 231-245
#   django.db.models.deletion.Collector.delete           lines 436-522
#
# Real causal chain (query.py:1126-1154, deletion.py): delete()
# instantiates a Collector, calls collector.collect() to recursively
# gather cascade-related objects (batching related-object lookups via
# get_del_batches() for each on_delete relation with more objects than
# fit one query), then calls collector.delete() to execute the actual
# SQL deletes.
#
# required_context/boundary_symbols (Gap 8), also real and verified:
#   django.db.models.query.QuerySet                                (class,  lines 293-1981)
#   django.db.models.deletion.Collector                            (class,  lines 96-522)
#   django.db.models.deletion.Collector.can_fast_delete             (method, lines 187-229, called by both collect() and delete() as a fast-path check)
#   django.db.models.query.QuerySet._chain                          (method, lines 1854-1863, boundary - direct setup callee of delete(), not part of the collect/delete cascade)
#   django.db.models.query.QuerySet._not_support_combined_queries   (method, lines 1963-1968, boundary - direct guard callee of delete())
#
# cohen_kappa is intentionally omitted - benchmarks.ground_truth.loader
# computes it for real (Positive Specific Agreement / Dice-F1, Hripcsak
# & Rothschild 2005) from annotation_a/annotation_b below, rather than
# trusting a hand-typed number.
