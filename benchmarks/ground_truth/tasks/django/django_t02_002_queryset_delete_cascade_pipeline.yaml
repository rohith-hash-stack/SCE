  expected_solution: >
    delete() instantiates a Collector, calls collector.collect() to
    recursively gather cascade-related objects (batching related-object
    lookups via get_del_batches() for each on_delete relation), then
    calls collector.delete() to execute the actual SQL deletes.
    Required context: the QuerySet and Collector classes, and
