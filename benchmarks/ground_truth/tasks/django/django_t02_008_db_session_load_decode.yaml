prompt: |
  You are debugging a Django database-backed session load in
  django/contrib/sessions/backends/db.py. Starting from
  `SessionStore.load`, trace the real causal pipeline a session load
  travels through, in the order each stage is actually reached at
  request time, up to and including the call that decodes the stored
  session data back into a Python dict. Assume a matching, unexpired
  session row exists in the database.

  First give a short (2-4 sentence) explanation of the pipeline.

  Then, on its own line, emit a fenced JSON code block containing an
  ordered array of the fully-qualified symbol names in that causal
  order - only symbols actually present in the provided context package
  may appear, e.g.:

  ```json
  ["django.contrib.sessions.backends.db.SessionStore.load", "django.contrib.sessions.backends.db.SessionStore._get_session_from_db"]
  ```

