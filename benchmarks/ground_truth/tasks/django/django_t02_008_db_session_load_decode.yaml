  expected_solution: >
    load() calls _get_session_from_db() to look up the real session
    row, then (since a matching row exists) calls self.decode() -
    inherited from SessionBase - on its session_data to get back the
    real dict. Required context: SessionStore and its parent SessionBase,
    which defines decode. Boundary: exists() (a sibling read-only check,
    not part of load's own chain) and encode() (the inverse operation,
    only used on save, not load).

