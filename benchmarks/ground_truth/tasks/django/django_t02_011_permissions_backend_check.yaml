  You are debugging Django's permission-check dispatch in
  django/contrib/auth/models.py. Starting from
  `PermissionsMixin.has_perm`, trace the real causal pipeline that
  determines which authentication backends will be consulted for the
  permission check, in the order each stage is actually reached, up to
  and including the call that enumerates those backends. Assume the
  user is not an active superuser, so the real backend-checking path is
  reached. Do not trace into any individual backend's own `has_perm`
  call - which backend's implementation actually runs, and how many
  are consulted, is resolved dynamically at runtime, not statically in
  this pipeline.

  First give a short (2-4 sentence) explanation of the pipeline.

  Then, on its own line, emit a fenced JSON code block containing an
  ordered array of the fully-qualified symbol names in that causal
  order - only symbols actually present in the provided context package
  may appear, e.g.:

  ```json
  ["django.contrib.auth.models.PermissionsMixin.has_perm", "django.contrib.auth.models._user_has_perm"]
  ```

