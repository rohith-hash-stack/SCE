# T02 "Django Debug" - Task 3: form field validation pipeline.
#
# Grounded in the real pinned Django 4.2.30 checkout (pinned_commit
# below). Verified against the real symbol table:
#
#   django.forms.forms.BaseForm.full_clean     lines 420-435
#   django.forms.forms.BaseForm._clean_fields   lines 437-451
#   django.forms.forms.BaseForm._clean_form     lines 453-460
#
# Real validation chain: full_clean() is the public entrypoint (called
# by is_valid()); it calls self._clean_fields() first (which runs each
# bound field's own field.clean() plus any user-defined clean_<field>()
# hook - dynamic per concrete form subclass, not a fixed BaseForm
# symbol, so it is described in prose rather than named as a pipeline
# stage here), then self._clean_form() (which runs the form-wide
# self.clean() hook and merges its return value into cleaned_data).
