# T02 "Django Debug" - Task 13: append-slash redirect on 404
# (Milestone 2 batch 3, seed 2/15 - subsystem: Middleware).
#
# Grounded in the real pinned Django 4.2.30 checkout (pinned_commit
# below) - every symbol here is real and indexed, verified against the
# real symbol table produced by prism.cli.build_pipeline on that exact
# checkout (qualified names and line ranges below match exactly; each
# has a real CALLS out-edge to the next stage in builder.graph).
#
#   django.middleware.common.CommonMiddleware.process_response              lines 100-115 (django/middleware/common.py)
#   django.middleware.common.CommonMiddleware.should_redirect_with_slash     lines 62-74  (django/middleware/common.py)
#   django.middleware.common.CommonMiddleware.get_full_path_with_slash       lines 76-98  (django/middleware/common.py)
#   django.middleware.common.CommonMiddleware.response_redirect_class        lines 32-32  (django/middleware/common.py)
#
# Real causal chain, read directly from source (common.py lines
# 100-108): process_response()'s first real statement is
# `if response.status_code == 404 and self.should_redirect_with_slash(
# request): return self.response_redirect_class(self.get_full_path_
# with_slash(request))`. Python's `and` short-circuits, so should_
# redirect_with_slash() is only reached when the status is 404; get_
# full_path_with_slash() and the response_redirect_class() call are
# only reached if should_redirect_with_slash() itself returns True.
# Explicit assumption this task's prompt states: assume the response
# has a 404 status code, and should_redirect_with_slash() determines
# that a slash-appended redirect is warranted - the real branch that
# reaches every stage in this pipeline, not the far more common
# "leave the 404 as-is" branch.
#
# Seed check (Milestone 2 requirements): CommonMiddleware is a plain
# MiddlewareMixin subclass, not metaclass-generated; nothing here is
# async/await; no container-subscript data-flow pattern is involved
# (pure call-chain). Different middleware class from
# django_t02_001_request_middleware_chain's BaseHandler-level chain -
# no overlap in seeds or traced symbols.
#
# Reachability check (batch-3 review): response_redirect_class is a
# plain class attribute (`response_redirect_class =
# HttpResponsePermanentRedirect`, common.py line 32) - it would be
# tempting to use the real class it points to,
# django.http.response.HttpResponsePermanentRedirect, as the "true"
# final pipeline stage instead. Checked directly and rejected:
# HttpResponsePermanentRedirect is a real, indexed symbol, but
# builder.graph has no edge - direct or via any alias - connecting
# process_response (or the response_redirect_class attribute node
# itself, which has zero out-edges) to it; its only real in-edges come
# from unrelated call sites elsewhere in the codebase (AdminSite.
# catch_all_view, SecurityMiddleware.process_request, etc., each their
# own separate INSTANTIATES edge). Using the class here would produce
# exactly the unreachable-terminal-stage problem
# django_t02_014_send_mail_pipeline hit and was trimmed for (see that
# task's own header, and the new G40 entry in design_formalism.md).
# response_redirect_class is the correct ground truth precisely because
# it is the one real, *reachable* edge target from process_response -
# not despite being "only" an attribute.
#
# required_context/boundary_symbols, also real and verified:
#   django.middleware.common.CommonMiddleware              (class)  lines 13-115
#   django.middleware.common.CommonMiddleware.process_request (method) lines 34-60
#
# cohen_kappa is intentionally omitted - benchmarks.ground_truth.loader
# computes it for real (Positive Specific Agreement / Dice-F1) from
# annotation_a/annotation_b below.
