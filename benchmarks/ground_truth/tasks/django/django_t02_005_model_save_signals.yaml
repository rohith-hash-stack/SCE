# T02 "Django Debug" - Task 5: model save lifecycle + signal dispatch.
#
# Grounded in the real pinned Django 4.2.30 checkout (pinned_commit
# below). Verified against the real symbol table:
#
#   django.db.models.base.Model.save         lines 767-819
#   django.db.models.base.Model.save_base    lines 835-899
#   django.db.models.base.Model._save_table  lines 938-1026  (a real
#     helper save_base() calls internally - one level below the
#     pipeline this task traces; included in annotation_b below as a
#     realistic annotator over-inclusion, and separately as this task's
#     real boundary_symbols entry - both real, just two different
#     annotated roles for the same real symbol)
#
# required_context/boundary_symbols (Gap 8), also real and verified:
#   django.db.models.base.Model               (class)
#   django.db.models.signals.pre_save         (Signal instance, attribute)
#   django.db.models.signals.post_save        (Signal instance, attribute)
#   django.db.models.base.Model._save_parents (method, boundary)
#   django.db.models.base.Model._save_table   (method, boundary)
#
# Real mutation lifecycle: Model.save() (the public API) delegates to
# self.save_base(...) to do the actual work. save_base() (base.py lines
# 861-867) sends the `pre_save` signal before writing, then (lines
# 892-899) sends `post_save` after. `pre_save`/`post_save` are
# django.db.models.signals.Signal *instances*, not methods defined in
# this file, so they're described in prose rather than listed as
# pipeline_symbols (which name real indexed method/function symbols).
