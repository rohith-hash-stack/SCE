prompt: |
  You are debugging Django's translation-catalog resolution in
  django/utils/translation/trans_real.py. Starting from `catalog()`,
  trace the real causal pipeline that produces the default-language
  translation catalog, in the order each stage is actually reached, up
  to and including the call that constructs the real translation
  object. Assume no translation has been activated yet in this process,
  and this is the very first request for the default language's
  catalog (the cold-start path, not a cache hit).

  First give a short (2-4 sentence) explanation of the pipeline.

  Then, on its own line, emit a fenced JSON code block containing an
  ordered array of the fully-qualified symbol names in that causal
  order - only symbols actually present in the provided context package
  may appear, e.g.:

  ```json
  ["django.utils.translation.trans_real.catalog", "django.utils.translation.trans_real.translation"]
  ```

annotation_a:
  annotator_id: annotator_a
  pipeline_symbols:
    - django.utils.translation.trans_real.catalog
    - django.utils.translation.trans_real.translation
    - django.utils.translation.trans_real.DjangoTranslation
  required_context: []
  boundary_symbols:
    - django.utils.translation.trans_real.activate
    - django.utils.translation.trans_real.DjangoTranslation.__init__
  expected_solution: >
    catalog() finds no active translation and no cached default, so it
    calls translation(settings.LANGUAGE_CODE); translation() finds the
    language not yet cached, so it constructs DjangoTranslation(language)
    - the real translation object. No required context beyond the
    pipeline itself. Boundary: activate() (installs a translation as
    current, a different real entry point not reached from catalog())
    and DjangoTranslation.__init__ (the constructor's own internals,
    one hop past the construction call this pipeline stops at).

