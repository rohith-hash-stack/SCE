# T02 "Django Debug" - Task 10: default translation catalog resolution
# (Milestone 2 batch 2, seed 2/15 - subsystem: i18n).
#
# Grounded in the real pinned Django 4.2.30 checkout (pinned_commit
# below) - every symbol here is real and indexed, verified against the
# real symbol table produced by prism.cli.build_pipeline on that exact
# checkout (qualified names and line ranges below match exactly; each
# has a real CALLS/INSTANTIATES out-edge to the next stage in
# builder.graph).
#
#   django.utils.translation.trans_real.catalog       lines 352-365 (django/utils/translation/trans_real.py)
#   django.utils.translation.trans_real.translation    lines 287-293 (django/utils/translation/trans_real.py)
#   django.utils.translation.trans_real.DjangoTranslation lines 130-284 (django/utils/translation/trans_real.py, class)
#
# Real causal chain, read directly from source (trans_real.py lines
# 352-365, 287-293): catalog() first checks for an already-active
# translation (`t = getattr(_active, "value", None)`) and returns it
# directly if one exists - only reaching `translation(settings.
# LANGUAGE_CODE)` when there is no active translation AND no cached
# module-level default (`_default is None`). translation(language)
# itself only constructs `DjangoTranslation(language)` when that
# language isn't already in the module-level `_translations` cache
# dict. Explicit assumption this task's prompt states: assume no
# translation has been activated yet in this process, and this is the
# very first request for the default language's catalog - the
# cold-start path, not the (far more common at steady state) warm-cache
# return.
#
# Seed check (Milestone 2 requirements): catalog/translation are plain
# module-level functions, not metaclass-generated; nothing here is
# async/await; no container-subscript data-flow pattern is involved
# (the `_translations`/`_active` module-level dicts are read/written,
# but never through the write-then-read-same-key pattern G7 covers -
# this task's pipeline never touches them as anything but background
# cache state, not traced symbols).
#
# required_context/boundary_symbols, also real and verified:
#   django.utils.translation.trans_real.activate                    (function) lines 296-303
#   django.utils.translation.trans_real.DjangoTranslation.__init__   (method)   lines 142-186
#
# No required_context beyond the pipeline itself is needed here - the
# task is self-contained (two thin module-level functions plus the
# class they construct), unlike the other batch-2 tasks which each
# depend on a real parent class. boundary_symbols: activate() (the
# sibling function that installs a translation as *current*, not part
# of catalog()'s own read path) and DjangoTranslation.__init__ (the
# real next step once the class is instantiated - a large, 13-callee
# constructor deliberately not traced further; the prompt's own
# stopping point is the construction itself, not what the constructor
# does internally).
#
# cohen_kappa is intentionally omitted - benchmarks.ground_truth.loader
# computes it for real (Positive Specific Agreement / Dice-F1) from
# annotation_a/annotation_b below.
