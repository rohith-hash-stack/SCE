prompt: |
  You are debugging why `QuerySet.filter()` always returns a distinct
  QuerySet object, never mutating the original in place, in
  django/db/models/query.py. Starting from `QuerySet.filter`, trace the
  real causal pipeline that produces the new, cloned queryset, in the
  order each stage is actually reached, up to and including the call
  that actually copies the queryset's internal state.

  First give a short (2-4 sentence) explanation of the pipeline.

  Then, on its own line, emit a fenced JSON code block containing an
  ordered array of the fully-qualified symbol names in that causal
  order - only symbols actually present in the provided context package
  may appear, e.g.:

  ```json
  ["django.db.models.query.QuerySet.filter", "django.db.models.query.QuerySet._not_support_combined_queries"]
  ```

