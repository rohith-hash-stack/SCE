# T02 "Django Debug" - Task 9: QuerySet.filter's real clone chain
# (Milestone 2 batch 2, seed 1/15 - subsystem: ORM).
#
# Grounded in the real pinned Django 4.2.30 checkout (pinned_commit
# below) - every symbol here is real and indexed, verified against the
# real symbol table produced by prism.cli.build_pipeline on that exact
# checkout (qualified names and line ranges below match exactly; each
# has a real CALLS out-edge to the next stage in builder.graph).
#
#   django.db.models.query.QuerySet.filter                          lines 1432-1438 (django/db/models/query.py)
#   django.db.models.query.QuerySet._not_support_combined_queries    lines 1963-1968 (django/db/models/query.py)
#   django.db.models.query.QuerySet._filter_or_exclude               lines 1448-1457 (django/db/models/query.py)
#   django.db.models.query.QuerySet._chain                           lines 1854-1863 (django/db/models/query.py)
#   django.db.models.query.QuerySet._clone                           lines 1865-1882 (django/db/models/query.py)
#
# Real causal chain, read directly from source (query.py lines
# 1432-1457, 1854-1863): filter() first calls
# self._not_support_combined_queries("filter") - unconditionally, the
# very first statement - then returns self._filter_or_exclude(False,
# args, kwargs). _filter_or_exclude() unconditionally calls
# self._chain(), which unconditionally calls self._clone(). No branch
# anywhere in this five-symbol chain depends on the arguments passed to
# filter() or on any queryset state - every stage is reached on every
# real call, no assumption needs to be stated. (The one real branch in
# _filter_or_exclude - whether to call _filter_or_exclude_inplace()
# immediately after _chain() returns, or to defer it - happens *after*
# _clone() has already run, so it does not gate anything in this
# traced pipeline; it is listed as boundary below instead.)
#
# Seed check (Milestone 2 requirements): QuerySet is a plain class, not
# metaclass-generated (Django's ModelBase metaclass applies to Model
# subclasses, not QuerySet); nothing here is async/await (the real
# `aget`/`acreate` wrappers live beside these methods but are not part
# of this chain); no container-subscript data-flow pattern is involved
# (pure call-chain).
#
# required_context/boundary_symbols, also real and verified:
#   django.db.models.query.QuerySet                            (class)  lines 293-1981
#   django.db.models.query.QuerySet.exclude                     (method) lines 1440-1446
#   django.db.models.query.QuerySet._filter_or_exclude_inplace  (method) lines 1459-1466
#
# cohen_kappa is intentionally omitted - benchmarks.ground_truth.loader
# computes it for real (Positive Specific Agreement / Dice-F1) from
# annotation_a/annotation_b below.
