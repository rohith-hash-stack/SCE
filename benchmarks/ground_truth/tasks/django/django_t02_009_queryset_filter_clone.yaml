  boundary_symbols:
    - django.db.models.query.QuerySet.exclude
    - django.db.models.query.QuerySet._filter_or_exclude_inplace
  expected_solution: >
    filter() calls _not_support_combined_queries() first, then
    _filter_or_exclude(), which calls _chain(), which calls _clone() -
    the real copy. Every stage is unconditional. Required context:
    QuerySet itself. Boundary: exclude() (the sibling negated-filter
    method sharing the same first two calls) and
    _filter_or_exclude_inplace() (the real next step after _clone
    returns, applying the actual Q-object filter, not part of the
    cloning pipeline this task traces).

