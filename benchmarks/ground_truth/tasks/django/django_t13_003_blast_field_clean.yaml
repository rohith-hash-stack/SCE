# (critical_callers) curated from the real output of
# benchmarks.metrics.bccr.compute_direct_and_transitive_callers(builder,
# seed) on this exact checkout.
#
# **Stated honestly**: unlike the other 3 blast tasks in this set,
# Field.clean's real caller graph in this pinned commit is thin on the
# *production* side - only one real, non-test direct caller
