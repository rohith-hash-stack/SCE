  boundary_symbols:
    - django.core.handlers.base.BaseHandler.check_response
    - django.core.handlers.base.BaseHandler.make_view_atomic
  expected_solution: >
    Annotator A's full chain is correct: _get_response's own first
    action (base.py line 180) is `callback, callback_args,
