seed_symbol: django.core.handlers.base.BaseHandler._get_response
task_type: debug
prompt: |
  You are debugging Django's request-handling entrypoint in
  django/core/handlers/base.py. Starting from
  `BaseHandler._get_response`, trace the exact causal pipeline a real
  HTTP request travels through this method: how the view callback is
  resolved, how it is wrapped before being invoked, and how the result
  is validated before being returned. Assume the wrapped callback
  raises an exception when invoked (the except branch), so the
  exception-middleware stage is part of the traced pipeline rather than
  skipped.

  First give a short (2-4 sentence) explanation of the pipeline.

  Then, on its own line, emit a fenced JSON code block containing an
  ordered array of the fully-qualified symbol names in that causal
  order - only symbols actually present in the provided context package
  may appear, e.g.:

  ```json
  ["django.core.handlers.base.BaseHandler._get_response", "django.core.handlers.base.BaseHandler.resolve_request"]
  ```

annotation_a:
  annotator_id: annotator_a
  pipeline_symbols:
    - django.core.handlers.base.BaseHandler._get_response
    - django.core.handlers.base.BaseHandler.resolve_request
    - django.core.handlers.base.BaseHandler.make_view_atomic
    - django.core.handlers.base.BaseHandler.process_exception_by_middleware
    - django.core.handlers.base.BaseHandler.check_response
  required_context:
    - django.core.handlers.base.BaseHandler
    - django.core.handlers.exception.convert_exception_to_response
    - django.db.transaction.atomic
    - django.urls.resolvers.get_resolver
  boundary_symbols:
    - django.core.handlers.base.BaseHandler._get_response_async
    - django.urls.base.set_urlconf
  expected_solution: >
    The full chain: _get_response() calls resolve_request() to get the
    view callback, make_view_atomic() to wrap it for ATOMIC_REQUESTS,
    invokes the wrapped callback (falling back to
    process_exception_by_middleware() on an uncaught exception), then
    check_response() validates the result isn't None/an uncalled
    coroutine. Required context: the BaseHandler class,
    convert_exception_to_response (used to wrap every middleware/
    handler in load_middleware), transaction.atomic (used inside
    make_view_atomic), and get_resolver (used inside resolve_request).
    Boundary: _get_response_async, the async sibling calling the same
    three helpers, and set_urlconf, a one-hop callee of resolve_request.

