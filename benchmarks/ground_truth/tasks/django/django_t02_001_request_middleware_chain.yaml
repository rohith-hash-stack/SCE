# T02 "Django Debug" - Task 1: request/response middleware chain.
#
# Grounded in the real pinned Django 4.2.30 checkout (pinned_commit
# below, matching benchmarks/corpora/pinned_commits.json's own "django"
# entry, tag 4.2.30) - every symbol here is a real, indexed
# django.core.handlers.base.BaseHandler method, verified against the
# real symbol table produced by prism.cli.build_pipeline on that
# checkout (qualified names and line ranges below match exactly).
#
#   django.core.handlers.base.BaseHandler.load_middleware  lines 26-102
#   django.core.handlers.base.BaseHandler.get_response     lines 136-150
#   django.core.handlers.base.BaseHandler._get_response    lines 174-226
#   django.core.handlers.base.BaseHandler.resolve_request  lines 300-315
#
# Real causal chain: load_middleware() builds self._middleware_chain
# (wrapping _get_response through every configured middleware, in
# reverse-MIDDLEWARE order); get_response() invokes that chain, which
# bottoms out in _get_response(), which calls self.resolve_request(request)
# to obtain the (callback, args, kwargs) it will actually dispatch to.
#
# required_context/boundary_symbols (Gap 8), also real and verified:
#   django.core.handlers.base.BaseHandler                            (class)
#   django.core.handlers.exception.convert_exception_to_response     (function)
#   django.core.handlers.base.BaseHandler.check_response              (method)
#   django.core.handlers.base.BaseHandler.make_view_atomic            (method)
#
# cohen_kappa is intentionally omitted - benchmarks.ground_truth.loader
# computes it for real (Positive Specific Agreement / Dice-F1, Hripcsak
# & Rothschild 2005) from annotation_a/annotation_b below - now over all
# three annotated sets (pipeline_symbols, required_context,
# boundary_symbols), not just the pipeline - rather than trusting a
# hand-typed number.
task_id: django_t02_001_request_middleware_chain
repo: django
pinned_commit: 3396992e837d5146270ea8112bb622c83fa4a919
seed_symbol: django.core.handlers.base.BaseHandler.load_middleware
task_type: debug
prompt: |
  You are debugging Django's request-handling entrypoint in
  django/core/handlers/base.py. Starting from
  `BaseHandler.load_middleware`, trace the exact causal pipeline a real
  HTTP request travels through this file, in the order each stage is
  actually reached at request time (not the order they're defined in
  the file), up to and including the call that resolves which view
  callback will handle the request.

  First give a short (2-4 sentence) explanation of the pipeline.

  Then, on its own line, emit a fenced JSON code block containing an
  ordered array of the fully-qualified symbol names in that causal
  order - only symbols actually present in the provided context package
  may appear, e.g.:

  ```json
  ["django.core.handlers.base.BaseHandler.load_middleware", "django.core.handlers.base.BaseHandler.get_response"]
  ```

annotation_a:
  annotator_id: annotator_a
  pipeline_symbols:
    - django.core.handlers.base.BaseHandler.load_middleware
    - django.core.handlers.base.BaseHandler.get_response
    - django.core.handlers.base.BaseHandler._get_response
    - django.core.handlers.base.BaseHandler.resolve_request
  required_context:
    - django.core.handlers.base.BaseHandler
    - django.core.handlers.exception.convert_exception_to_response
  boundary_symbols:
    - django.core.handlers.base.BaseHandler.check_response
    - django.core.handlers.base.BaseHandler.make_view_atomic
  expected_solution: >
    The full chain: load_middleware() builds the wrapped handler chain,
    get_response() invokes it, which bottoms out in _get_response(),
    which calls resolve_request() to get the view callback. Required
    context: the BaseHandler class itself, and convert_exception_to_
    response, which load_middleware() wraps every middleware/handler in.
    Boundary: check_response() and make_view_atomic(), both called from
    _get_response() but not part of the causal chain itself.

annotation_b:
  annotator_id: annotator_b
  pipeline_symbols:
    - django.core.handlers.base.BaseHandler.load_middleware
    - django.core.handlers.base.BaseHandler.get_response
    - django.core.handlers.base.BaseHandler._get_response
  required_context:
    - django.core.handlers.base.BaseHandler
    - django.core.handlers.exception.convert_exception_to_response
  boundary_symbols:
    - django.core.handlers.base.BaseHandler.check_response
    - django.core.handlers.base.BaseHandler.make_view_atomic
  expected_solution: >
    load_middleware() builds the chain, get_response() runs it, which
