# source line `self.add_route(...)` inside FastAPI.setup's own body - so a model that correctly,
# thoroughly reads its own context reliably names it anyway. Two independent fix attempts were
# tried and both failed to change the outcome:
#   Round 2 (commit 6886b9f): prompt named "add_route" explicitly as excluded -> 0/12 (WORSE
#     than round 1's accidental 8/12 - a real negative-constraint-priming regression, confirmed).
#   Round 3 (commit 6154742): prompt rephrased to state the boundary purely structurally, never
#     naming "add_route" -> still 0/12. This ruled out priming as the cause for THIS task
#     specifically: round-3 raw responses (fresh LLM calls, confirmed non-identical text run to
#     run) still name add_route via reasoning grounded in the real source, not an echoed prompt
