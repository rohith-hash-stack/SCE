#     identical round-3 treatment took them from 2/12 and 5/12 to a clean 12/12 - proving the
#     round-3 fix pattern works when the excluded symbol is NOT independently visible in the
#     model's own source context, and that this task's floor is a genuine construct-validity
#     limit of the exact-match scorer given real source-code exposure, not a fixable prompt defect.
