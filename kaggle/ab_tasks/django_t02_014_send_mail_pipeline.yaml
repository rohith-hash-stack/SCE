    checking the actual source, which handles it as a conditional
    post-construction step.) Agreed on required context and boundary
    symbols.

adjudicated:
  annotator_id: adjudicator
  pipeline_symbols:
    - django.core.mail.send_mail
    - django.core.mail.get_connection
    - django.core.mail.message.EmailMultiAlternatives
    - django.core.mail.message.EmailMultiAlternatives.attach_alternative
  required_context:
    - django.core.mail.message.EmailMessage
  boundary_symbols:
    - django.core.mail.message.EmailMessage.recipients
    - django.core.mail.message.EmailMessage.get_connection
    - django.core.mail.message.EmailMessage.send
  expected_solution: >
    Annotator A's full chain is correct: __init__.py lines 84-85 show
    `if html_message: mail.attach_alternative(html_message,
    "text/html")` as its own distinct statement, not a constructor
    argument - EmailMultiAlternatives's own __init__ (message.py) takes
    no html_message parameter at all, confirming this must be a
    separate, later, real call. The prompt's own explicit stopping
    point ("up to and including the call that attaches the HTML
    alternative body") requires including it.
