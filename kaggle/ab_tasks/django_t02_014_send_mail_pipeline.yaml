seed_symbol: django.core.mail.send_mail
task_type: debug
prompt: |
  You are debugging Django's `send_mail` convenience wrapper in
  django/core/mail/__init__.py. Starting from `send_mail`, trace the
  real causal pipeline a call travels through, in the order each stage
  is actually reached, up to and including the call that attaches the
  HTML alternative body. Assume no explicit `connection` argument was
  passed in (the default), and that an HTML alternative body is
  provided via `html_message`.

  First give a short (2-4 sentence) explanation of the pipeline.

  Then, on its own line, emit a fenced JSON code block containing an
  ordered array of the fully-qualified symbol names in that causal
  order - only symbols actually present in the provided context package
  may appear, e.g.:

  ```json
  ["django.core.mail.send_mail", "django.core.mail.get_connection"]
  ```

annotation_a:
  annotator_id: annotator_a
  pipeline_symbols:
    - django.core.mail.send_mail
    - django.core.mail.get_connection
    - django.core.mail.message.EmailMultiAlternatives
    - django.core.mail.message.EmailMultiAlternatives.attach_alternative
  required_context:
    - django.core.mail.message.EmailMessage
  boundary_symbols:
    - django.core.mail.message.EmailMessage.recipients
    - django.core.mail.message.EmailMessage.get_connection
    - django.core.mail.message.EmailMessage.send
  expected_solution: >
    send_mail() calls get_connection() since no connection was passed
    in, constructs an EmailMultiAlternatives message, then attaches the
    HTML alternative since one was provided. Required context:
    EmailMessage, which EmailMultiAlternatives extends. Boundary:
    recipients() and get_connection() (the instance method, distinct
    from the module-level function of the same simple name), plus
    send() - the real next step, but not reachable from this seed
    through the current call graph (EmailMultiAlternatives inherits
    send() from EmailMessage, and nothing in this codebase's call
    resolution follows that inheritance edge).

annotation_b:
  annotator_id: annotator_b
  pipeline_symbols:
    - django.core.mail.send_mail
    - django.core.mail.get_connection
    - django.core.mail.message.EmailMultiAlternatives
  required_context:
    - django.core.mail.message.EmailMessage
  boundary_symbols:
    - django.core.mail.message.EmailMessage.recipients
    - django.core.mail.message.EmailMessage.get_connection
    - django.core.mail.message.EmailMessage.send
  expected_solution: >
    send_mail() calls get_connection(), then constructs an
    EmailMultiAlternatives message. (Missed that attaching the HTML
    alternative is itself a separate traced call, attach_alternative()
