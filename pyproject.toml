[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-context-engine"
version = "1.0.0"
description = "SCE: a deterministic, offline dual-layer semantic graph engine that extracts variable-resolution (L0-L3) context slices from a cloned repository for LLM coding agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Semantic Context Engine Contributors" }]

dependencies = [
    "tree-sitter>=0.23,<1.0",
    "tree-sitter-python>=0.23,<1.0",
    "tree-sitter-javascript>=0.23,<1.0",
    "tree-sitter-typescript>=0.23,<1.0",
    "tree-sitter-go>=0.23,<1.0",
    "networkx>=3.0,<4.0",
    "click>=8.0,<9.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
sce = "sce.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
