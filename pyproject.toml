[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-context"
version = "0.2.0"
description = "Deterministic dual-graph semantic context engine for polyglot codebases."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Prism Contributors" }]

dependencies = [
    "tree-sitter>=0.23,<1.0",
    "tree-sitter-python>=0.23,<1.0",
    "tree-sitter-javascript>=0.23,<1.0",
    "tree-sitter-typescript>=0.23,<1.0",
    "tree-sitter-go>=0.23,<1.0",
    "tree-sitter-java>=0.23,<1.0",
    "tree-sitter-c-sharp>=0.23,<1.0",
    "networkx>=3.0,<4.0",
    "scipy>=1.11,<2.0",
    "click>=8.0,<9.0",
    # Core, not optional: `uvx --from git+https://...` (and a plain `pip
    # install prism-context`) must run `prism mcp` out of the box,
    # with no extras flag, for the zero-install VS Code/Claude Desktop
    # setup documented in docs/mcp_setup.md to actually be zero-install.
    # `prism.cli`'s `mcp` command (src/prism/cli.py) still imports
    # `prism.mcp.server` lazily rather than at module load time - that stays
    # unchanged and keeps `prism index`/`query`/`trace`/`status` free of any
    # MCP-specific import cost - but the dependency itself is no longer
    # conditional on an extra.
    "mcp[cli]>=2.0,<3.0",
    # Core, not dev-only, as of Issues #11/#13: `prism.slicer.knapsack`'s
    # token-budget gating now uses real BPE token counts
    # (`prism.slicer.tokenizer`) instead of a flat word-count heuristic
    # that measurably drifted +-25%-class against a real tokenizer across
    # languages. `prism.slicer.tokenizer` still degrades to a
    # deterministic regex approximation (never raises) if the encoding
    # table can't be loaded at runtime (a genuinely air-gapped environment
    # with tiktoken's remote blob host unreachable), so this is a real
    # accuracy upgrade for the overwhelming common case, not a hard
    # requirement for the engine to run at all.
    "tiktoken>=0.7,<1.0",
    # Core, not dev-only: `prism.surface.parser.parse_context` (v1.1+
    # Agent Surface) must reject XML entity-expansion attacks ("billion
    # laughs", external entity resolution) when reconstructing a
    # `<prism_context>` envelope from untrusted input (an MCP client, or
    # a fetched artifact) - the stdlib `xml.etree.ElementTree` this
    # codebase's own renderer already uses for *building* trusted output
    # was never meant to *parse* untrusted input safely.
    "defusedxml>=0.7,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "hypothesis>=6.0,<7.0", "openai>=1.0", "python-dotenv>=1.0,<2.0", "sqlalchemy>=2.0,<3.0"]

[project.scripts]
prism = "prism.cli:main"
# Backward-compatibility alias for anyone with an existing `sce` config
# (VS Code mcp.json, a shell alias, ...) from before the Prism rebrand.
sce = "prism.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
