[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-context-engine"
version = "0.1.0"
description = "SCE: a deterministic, offline dual-layer semantic graph engine that extracts variable-resolution (L0-L3) context slices from a cloned repository for LLM coding agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Semantic Context Engine Contributors" }]

dependencies = [
    "tree-sitter>=0.23,<1.0",
    "tree-sitter-python>=0.23,<1.0",
    "tree-sitter-javascript>=0.23,<1.0",
    "tree-sitter-typescript>=0.23,<1.0",
    "tree-sitter-go>=0.23,<1.0",
    "tree-sitter-java>=0.23,<1.0",
    "tree-sitter-c-sharp>=0.23,<1.0",
    "networkx>=3.0,<4.0",
    "click>=8.0,<9.0",
    # Core, not optional: `uvx --from git+https://...` (and a plain `pip
    # install semantic-context-engine`) must run `sce mcp` out of the box,
    # with no extras flag, for the zero-install VS Code/Claude Desktop
    # setup documented in docs/mcp_setup.md to actually be zero-install.
    # `sce.cli`'s `mcp` command (src/sce/cli.py) still imports
    # `sce.mcp.server` lazily rather than at module load time - that stays
    # unchanged and keeps `sce index`/`query`/`trace`/`status` free of any
    # MCP-specific import cost - but the dependency itself is no longer
    # conditional on an extra.
    "mcp[cli]>=2.0,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "tiktoken>=0.7,<1.0", "openai>=1.0", "python-dotenv>=1.0,<2.0", "sqlalchemy>=2.0,<3.0"]

[project.scripts]
sce = "sce.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
